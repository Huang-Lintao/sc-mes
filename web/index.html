<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多孔碳 MES · 数据追溯平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%232563eb'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif'>MES</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bootLoader" aria-live="polite">
  <div class="boot-card">
    <div class="boot-spinner"></div>
    <div class="boot-title">多孔碳生产追溯</div>
    <div class="boot-sub">正在加载数据与图表…</div>
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">MES</div>
      <div class="brand-text">
        <div class="brand-name">多孔碳生产追溯</div>
        <div class="brand-sub">粉碎分级工序</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="page-title" id="pageTitle"></div>
      <div class="top-actions">
        <button class="theme-toggle" id="themeToggle" title="切换明/暗主题" aria-label="切换主题">
          <i data-lucide="moon"></i>
        </button>
        <div class="search" id="searchWrap">
          <i data-lucide="search"></i>
          <input id="globalSearch" type="text" placeholder="搜索批号，如 ACQ-4-M-2607…" autocomplete="off">
          <div class="search-drop" id="searchDrop"></div>
        </div>
        <div class="seg" id="productSeg"></div>
      </div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot"></div>

<script src="js/vendor/echarts.min.js"></script>
<script src="js/vendor/xlsx.full.min.js"></script>
<script src="js/vendor/lucide.min.js"></script>
<script src="js/vendor/gsap.min.js"></script>
<script src="data/mes-data.js"></script>
<script src="js/animations.js"></script>
<script src="js/control-limits.js"></script>
<script src="js/app.js"></script>
<script src="js/view-dashboard.js"></script>
<script src="js/view-batches.js"></script>
<script src="js/view-trace.js"></script>
<script src="js/view-quality.js"></script>
<script src="js/view-specs.js"></script>
<script src="js/view-data.js"></script>
<script>App.init();</script>
</body>
</html>
